name: Build

# MANUAL TRIGGER ONLY - Creates a new GitHub Release with desktop app artifacts.
# Go to Actions → Release → Run workflow → Enter version (e.g., 0.1.0)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0.0) - without "v" prefix'
        required: true
        type: string

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Read the changelog
        uses: ForNeVeR/ChangelogAutomation.action@v2
        with:
          input: ./CHANGELOG.md
          output: ./changelog-section.md
      - name: Release body from changelog
        id: release_body
        run: |
          {
            echo 'body<<EOF'
            cat changelog-section.md
            echo ''
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

  build-windows:
    runs-on: windows-latest
    needs: changelog
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'  # 'recursive' 会拉取主仓库以及所有嵌套子模块

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Read Version from LunaTV/LunaTV.csproj
        id: get_version
        shell: pwsh
        run: |
          $csprojPath = "LunaTV/LunaTV.csproj"
          [xml]$xml = Get-Content $csprojPath
          $version = $xml.Project.PropertyGroup.AssemblyVersion
          if (-not $version) { $version = "0.0.0.0" }
          Write-Host "提取到的版本号: $version"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: Publish Desktop App (win-x64)
        shell: pwsh
        run: |
          dotnet publish LunaTV/LunaTV.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o ./publish

      - name: Zip artifact
        shell: pwsh
        run: |
          $artifactName = "LunaTV-Windows-x64-${{ steps.get_version.outputs.version }}"
          Expand-Archive -Path "./publish/libmpv-2.zip" -DestinationPath "./publish"
          Remove-Item -Path "./publish/libmpv-2.zip"
          Compress-Archive -Path ./publish/* -DestinationPath "./$artifactName.zip"

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          artifacts: $artifactName.zip
          body: ${{ needs.changelog.steps.release_body.outputs.body }}
    